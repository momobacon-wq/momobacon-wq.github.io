<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>請輸入密碼</title>
<style>
:root { color-scheme: light dark; --bg: #f4f5f7; --card: #fff; --ink: #1c2330; --muted: #667085; --line: #d5d9e0; --accent: #0b5cad; --on: #fff; --err: #b3261e; }
@media (prefers-color-scheme: dark) { :root { --bg: #12151b; --card: #1b2029; --ink: #e8ebf0; --muted: #98a2b3; --line: #2c3440; --accent: #6cb0f5; --on: #0c1420; --err: #ff8a80; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; background: var(--bg); color: var(--ink); font: 16px/1.5 "Microsoft JhengHei", "PingFang TC", system-ui, sans-serif; }
form { width: 100%; max-width: 360px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 24px; }
h1 { font-size: 1.15rem; margin: 0 0 16px; }
label { display: block; font-size: .9rem; color: var(--muted); margin-bottom: 4px; }
input[type=password] { width: 100%; font: inherit; color: inherit; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 10px; }
.row { display: flex; align-items: center; gap: 8px; margin: 12px 0; font-size: .9rem; }
.row label { display: inline; margin: 0; }
button { width: 100%; font: inherit; border: 0; border-radius: 8px; padding: 10px; background: var(--accent); color: var(--on); cursor: pointer; }
button:disabled { opacity: .6; cursor: default; }
#msg { min-height: 1.5em; margin-top: 10px; font-size: .9rem; color: var(--err); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<form id="f" autocomplete="off">
  <h1>此頁面需要密碼</h1>
  <label for="pw">密碼</label>
  <input type="password" id="pw" autocomplete="current-password" autofocus required>
  <div class="row"><input type="checkbox" id="keep"><label for="keep">在這台裝置記住(請勿用於公用電腦)</label></div>
  <button type="submit" id="go">開啟</button>
  <div id="msg" role="alert"></div>
</form>

<script>
(function () {
  'use strict';
  var P = JSON.parse(document.getElementById('payload').textContent);
  var KEY = 'hsinta.duty.key';
  var msg = document.getElementById('msg'), go = document.getElementById('go');
  function b64(s) { var b = atob(s), a = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return a; }
  function hex(buf) { return Array.prototype.map.call(new Uint8Array(buf), function (x) { return ('0' + x.toString(16)).slice(-2); }).join(''); }
  function unhex(s) { var a = new Uint8Array(s.length / 2); for (var i = 0; i < a.length; i++) a[i] = parseInt(s.substr(i * 2, 2), 16); return a; }
  function derive(pw) {
    return crypto.subtle.importKey('raw', new TextEncoder().encode(pw.normalize('NFKC')), 'PBKDF2', false, ['deriveBits'])
      .then(function (k) { return crypto.subtle.deriveBits({ name: 'PBKDF2', salt: b64(P.s), iterations: P.i, hash: 'SHA-256' }, k, 256); });
  }
  function open(raw) {
    return crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt'])
      .then(function (k) { return crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(P.v) }, k, b64(P.c)); })
      .then(function (plain) { var html = new TextDecoder().decode(plain); document.open(); document.write(html); document.close(); });
  }
  if (!window.crypto || !crypto.subtle) { msg.textContent = '此瀏覽器或連線方式不支援解密,請改用 https 或較新的瀏覽器。'; go.disabled = true; return; }
  try { var saved = localStorage.getItem(KEY); if (saved) open(unhex(saved)).catch(function () { try { localStorage.removeItem(KEY); } catch (e) {} }); } catch (e) {}
  document.getElementById('f').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var pw = document.getElementById('pw').value.trim(), keep = document.getElementById('keep').checked;
    go.disabled = true; msg.textContent = '';
    derive(pw).then(function (raw) {
      return open(raw).then(function () { if (keep) { try { localStorage.setItem(KEY, hex(raw)); } catch (e) {} } });
    }).catch(function () { msg.textContent = '密碼不正確。'; go.disabled = false; document.getElementById('pw').select(); });
  });
})();
